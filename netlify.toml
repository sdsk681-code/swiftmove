[build]
  command = "pnpm install && pnpm --filter @workspace/swiftmove run build"
  publish = "artifacts/swiftmove/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT = "3000"
  BASE_PATH = "/"
  VITE_TRPC_URL = "/trpc"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send /api/trpc/* requests to the serverless function (frontend default)
[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200
  force = true

# Send /trpc/* requests to the serverless function (VITE_TRPC_URL override)
[[redirects]]
  from = "/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
