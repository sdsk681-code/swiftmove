[build]
  command = "pnpm install && pnpm --filter @workspace/swiftmove run build"
  publish = "artifacts/swiftmove/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT = "3000"
  BASE_PATH = "/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send all /trpc/* requests to the serverless function
[[redirects]]
  from = "/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
